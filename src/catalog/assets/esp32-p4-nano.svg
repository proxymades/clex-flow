  <title id="p4-title">Waveshare ESP32-P4-NANO, вид со стороны компонентов</title>
  <desc id="p4-description">Квадратная плата с двумя длинными FPC-разъёмами LCD и CAM, USB-C сверху, RJ45 и вертикальным USB-A снизу. Справа внизу модуль ESP32-C6 с печатной антенной.</desc>
