<svg xmlns="http://www.w3.org/2000/svg" width="490" height="430" viewBox="0 0 490 430" role="img" aria-label="ESP32-CAM, вид со стороны модуля ESP32, антенна сверху">
  <title>ESP32-CAM</title>
  <desc>Вид платы со стороны модуля ESP32-S. Сверху печатная антенна, сбоку разъём U.FL. Ниже находятся PSRAM, стабилизатор и кнопка сброса. По бокам два ряда по восемь контактов.</desc>
  <defs>
    <linearGradient id="cam-pcb" x2="1" y2="1"><stop stop-color="#222a2b"/><stop offset=".5" stop-color="#12191b"/><stop offset="1" stop-color="#22292a"/></linearGradient>
    <linearGradient id="cam-can" x2="1" y2=".2"><stop stop-color="#8c9695"/><stop offset=".28" stop-color="#dce0d6"/><stop offset=".65" stop-color="#aeb7b0"/><stop offset="1" stop-color="#889594"/></linearGradient>
    <linearGradient id="cam-gold"><stop stop-color="#9e7835"/><stop offset=".45" stop-color="#e2c779"/><stop offset="1" stop-color="#b28a46"/></linearGradient>
    <pattern id="cam-brushed" width="5" height="3" patternUnits="userSpaceOnUse"><path d="M0 1h5" stroke="#e4ebe3" stroke-width=".7" opacity=".21"/></pattern>
    <g id="cam-contact">
      <circle r="7.7" fill="#1d2426" stroke="#6a7876" stroke-width="1.2"/>
      <circle r="5.8" fill="url(#cam-gold)"/>
      <circle r="2.3" fill="#384843"/>
    </g>
    <g id="cam-module-pad"><rect width="7" height="5.5" rx=".7" fill="url(#cam-can)" stroke="#7c8a83" stroke-width=".4"/></g>
    <g id="cam-passive"><rect width="12" height="6" rx="1" fill="#b2bcb2"/><rect x="2.5" width="7" height="6" fill="#847659"/></g>
  </defs>
