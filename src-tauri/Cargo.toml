[package]
name = "clex-flow"
version = "0.1.0"
description = "CLEX Flow – Visual Microcontroller Studio"
edition = "2021"
license = "MIT"

[lib]
name = "clex_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

sha2 = "0.10"
libc = "0.2"
